name: Pages

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "report/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: pages-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage the rendered reports
        run: |
          test -s report/report.html
          test -s report/user_guide.html
          mkdir -p _site
          cp report/report.html _site/index.html
          cp report/user_guide.html _site/user-guide.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: pages-deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
